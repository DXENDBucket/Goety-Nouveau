plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = 'dev.goetynouveau'
version = file('VERSION').text.trim()
base { archivesName = 'goety-nouveau' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets.main { java.srcDir 'common/src/main/java'; resources.srcDir 'common/src/main/resources' }
sourceSets { gameTest {
    java.srcDir 'common/src/gameTest/java'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
} }
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

evaluationDependsOn(':ars-conflux')
def confluxMain = project(':ars-conflux').sourceSets.main
def coexistWithIron = providers.gradleProperty('withIron').getOrElse('false').toBoolean()
neoForge {
    version = '21.1.250'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client {
            client()
            if(providers.gradleProperty('nativeSelfPreview').getOrElse('false').toBoolean()) {
                systemProperty 'goetynouveau.native_self_test','true'
                systemProperty 'goetynouveau.native_self_preview','true'
                jvmArgument '-Xmx900m'
                gameDirectory=file('run/native-focus-preview')
            }
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            if(providers.gradleProperty('nativeSelfTests').getOrElse('false').toBoolean())systemProperty 'goetynouveau.native_self_test','true'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces')
                    .getOrElse(coexistWithIron ? 'goety_nouveau_coexistence' : 'goety_nouveau')
            jvmArgument '-Xmx'+providers.gradleProperty('gameTestHeap').getOrElse('2G')
        }
    }
    mods {
        ars_conflux { sourceSet confluxMain }
        goety_nouveau { sourceSet sourceSets.main; sourceSet sourceSets.gameTest }
    }
}
dependencies {
    implementation project(':ars-conflux')
    compileOnly fileTree(dir:'libs/optional',include:'goety-charms-*.jar')
    if(providers.gradleProperty('withCharms').getOrElse('false').toBoolean())runtimeOnly fileTree(dir:'libs/optional',include:'goety-charms-*.jar')
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
    // Development-only optional coexistence run; never a production dependency or bundled JAR.
    if (coexistWithIron) runtimeOnly fileTree(dir: 'libs/coexistence', include: '*.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
tasks.named('jar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    archiveFileName = "goety-nouveau-${project.version}-mc1.21.1-neoforge.jar"
}
tasks.named('sourcesJar') { from('LICENSE', 'THIRD_PARTY_NOTICES.md') }

ext.glyphLocalizationRoot = file("common/src/main/resources/assets/goety_nouveau/lang")
apply from: "gradle/validate-localization.gradle"

ext.glyphRecipeRoot = file(".")
ext.glyphRecipeLoader = "neoforge"
apply from: "gradle/glyph-recipes.gradle"
