plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.36'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'dev.goetynouveau'
version = file('../VERSION').text.trim()
base { archivesName = 'goety-nouveau' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
repositories { flatDir { dirs 'libs','libs/optional' }; mavenCentral { content { excludeGroup 'local' } } }
sourceSets.main { java.srcDir '../common/src/main/java'; resources.srcDir '../common/src/main/resources' }
sourceSets { gameTest {
    java.srcDir '../common/src/gameTest/java'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
} }
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

evaluationDependsOn(':ars-conflux')
def confluxMain = project(':ars-conflux').sourceSets.main
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // Included source directories have no release-JAR manifest to register Core's mixins.
            args '--mixin.config', 'ars_conflux.mixins.json'
        }
        client {
            workingDirectory project.file('run/client')
            if(providers.gradleProperty('nativeSelfPreview').getOrElse('false').toBoolean()) {
                property 'goetynouveau.native_self_test','true'
                property 'goetynouveau.native_self_preview','true'
                workingDirectory project.file('run/native-focus-preview')
                jvmArgs '-Xmx900m'
            }
            mods { ars_conflux { source confluxMain }; goety_nouveau { source sourceSets.main; if(providers.gradleProperty('nativeSelfPreview').getOrElse('false').toBoolean()) source sourceSets.gameTest } }
        }
        server {
            workingDirectory project.file('run/server'); args '--nogui'
            mods { ars_conflux { source confluxMain }; goety_nouveau { source sourceSets.main } }
        }
        gameTestServer {
            workingDirectory project.file('run/gametest')
            if(providers.gradleProperty('nativeSelfTests').getOrElse('false').toBoolean())property 'goetynouveau.native_self_test','true'
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse('goety_nouveau')
            jvmArgs '-Xmx'+providers.gradleProperty('gameTestHeap').getOrElse('2G')
            mods { ars_conflux { source confluxMain }; goety_nouveau { source sourceSets.main; source sourceSets.gameTest } }
        }
    }
}
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Ars Conflux supplies the runtime; only expose the hook API/processor here.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    implementation project(':ars-conflux')
    compileOnly fg.deobf('local:goety-charms:0.2.2-forge1201')
    if(providers.gradleProperty('withCharms').getOrElse('false').toBoolean())runtimeOnly fg.deobf('local:goety-charms:0.2.2-forge1201')
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    for (name in ['ars-nouveau', 'geckolib', 'curios', 'patchouli']) {
        implementation fg.deobf("local:${name}:forge1201")
    }
    // A distinct coordinate prevents ForgeGradle reusing the older Goety deobfuscation cache.
    implementation fg.deobf('local:goety:2.5.59.2-forge1201')
}
mixin { add sourceSets.main, 'goety_nouveau.refmap.json'; config 'goety_nouveau.mixins.json' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
tasks.named('jar') {
    from('../LICENSE', '../THIRD_PARTY_NOTICES.md')
    archiveFileName = "goety-nouveau-${project.version}-mc1.20.1-forge.jar"
    finalizedBy 'reobfJar'
    manifest { attributes 'MixinConfigs': 'goety_nouveau.mixins.json' }
}
tasks.named('sourcesJar') { from('../LICENSE', '../THIRD_PARTY_NOTICES.md') }

ext.glyphLocalizationRoot = file("../common/src/main/resources/assets/goety_nouveau/lang")
apply from: "../gradle/validate-localization.gradle"

ext.glyphRecipeRoot = file("..")
ext.glyphRecipeLoader = "forge"
apply from: "../gradle/glyph-recipes.gradle"
